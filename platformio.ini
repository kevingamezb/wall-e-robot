; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; El código del firmware vive bajo firmware/ (src, lib e include).
[platformio]
default_envs = esp32dev
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include
test_dir = firmware/test

[env:esp32dev]
; Version fijada: la 8.x trae Arduino core 3.x, que cambio la API del watchdog
; (esp_task_wdt_init) y rompe el firmware. La 7.0.1 usa Arduino core 2.x, la
; misma con la que se probo el robot.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filter = esp32_exception_decoder, default
; El SDK del ESP32 también tiene un archivo "config.h": sin este -I, las
; librerías propias (firmware/lib/*) resolverían ese config.h y no el del proyecto.
build_flags = 
	-Ifirmware/include
lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	madhephaestus/ESP32Servo@^3.0.0
	adafruit/Adafruit INA219@^1.1.3
	adafruit/Adafruit SSD1306@^2.5.7
; Tras compilar, imprime versión + MD5 de firmware.bin (para el portal OTA).
extra_scripts = post:scripts/firmware_manifest.py

; Entorno nativo: prueba la lógica pura de decisión sin ESP32 ni hardware.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17
