name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    name: App y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Tkinter is importable
        run: python -c "import tkinter, _tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run tests with coverage
        run: |
          xvfb-run -a python -m pytest -v \
            --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run test drawers
        run: |
          xvfb-run -a python pruebas/ejecutar_cajones.py

  firmware:
    name: Firmware ESP32 y pruebas nativas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Write test credentials
        run: |
          cat > firmware/include/secrets.h <<'EOF'
          // Credenciales SOLO para CI. No son las del equipo.
          #ifndef SECRETS_H
          #define SECRETS_H

          #define WIFI_AP_CLAVE "clave-ci-1234"
          #define OTA_USUARIO   "ci"
          #define OTA_CLAVE     "clave-ci-ota-1234"

          #endif // SECRETS_H
          EOF

      - name: Compile firmware
        run: pio run

      - name: Native decision tests
        run: pio test -e native
