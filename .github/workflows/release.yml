# wall-e-robot — build de distribución y GitHub Release.
#
# PyInstaller NO cross-compila: cada ZIP se genera en su sistema operativo.
#   - firmware: se compila UNA VEZ en Linux (el .bin del ESP32 es igual desde
#     cualquier PC) con la clave de distribución (secrets de GitHub).
#   - linux:   build en Ubuntu 22.04 para que el binario arranque en
#              Debian/Ubuntu/Mint >= 22.04 (glibc 2.35+).
#   - windows: build en windows-latest.
#   - release: publica los ZIPs + firmware en un GitHub Release al etiquetar.
#
# macOS queda fuera de momento: exigiría un runner macos (minutos dobles) y
# además firma/ notarización de Apple para evitar avisos de Gatekeeper.
#
# Uso:
#   git tag v1.0.0 && git push origin v1.0.0   # compila y publica el Release
#   Actions > Release > Run workflow           # solo compilar, sin Release
#
# Requiere los secrets del repo: WIFI_AP_CLAVE y OTA_CLAVE (del equipo).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware (una vez, para todas las plataformas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Comprobar que el tag coincide con PROYECTO_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'PROYECTO_VERSION\s*=\s*"\K[^"]+' firmware/include/config.h)
          echo "tag=$tag  PROYECTO_VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::El tag v$tag no coincide con PROYECTO_VERSION ($version) de config.h"
            exit 1
          fi

      - name: Escribir la clave de distribución (secrets del repo)
        env:
          WIFI_AP_CLAVE: ${{ secrets.WIFI_AP_CLAVE }}
          OTA_USUARIO: ${{ secrets.OTA_USUARIO }}
          OTA_CLAVE: ${{ secrets.OTA_CLAVE }}
        run: |
          if [ -z "$WIFI_AP_CLAVE" ] || [ -z "$OTA_CLAVE" ]; then
            echo "::error::Faltan los secrets WIFI_AP_CLAVE y/o OTA_CLAVE (Settings > Secrets)."
            exit 1
          fi
          cat > empaquetado/secrets.distribucion.h <<EOF
          // Generado por CI en el build de release. No se versiona.
          #ifndef SECRETS_H
          #define SECRETS_H

          #define WIFI_AP_CLAVE "$WIFI_AP_CLAVE"

          #define OTA_USUARIO   "${OTA_USUARIO:-walle}"
          #define OTA_CLAVE     "$OTA_CLAVE"

          #endif // SECRETS_H
          EOF
          # El AP no debe quedar abierto en una distribución real.
          grep -q 'WIFI_AP_CLAVE ""' empaquetado/secrets.distribucion.h && \
            { echo "::error::WIFI_AP_CLAVE quedó vacía."; exit 1; } || true

      - name: Compilar el firmware de distribución
        run: python scripts/empaquetar_distribucion.py --solo-firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            dist/firmware.bin
            dist/firmware.bin.md5

  linux:
    name: App Linux (Debian/Ubuntu/Mint)
    runs-on: ubuntu-22.04
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Pruebas
        run: python -m pytest -v

      - name: Empaquetar
        run: python scripts/empaquetar_distribucion.py --firmware-bin dist/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: wall-e-linux
          path: dist/wall-e-*-linux64.zip

  windows:
    name: App Windows
    runs-on: windows-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Pruebas
        run: python -m pytest -v

      - name: Empaquetar
        run: python scripts/empaquetar_distribucion.py --firmware-bin dist/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: wall-e-windows
          path: dist/wall-e-*-win64.zip

  release:
    name: Publicar el GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l paquetes/
          gh release create "$GITHUB_REF_NAME" paquetes/* \
            --title "WALL-E $GITHUB_REF_NAME" \
            --generate-notes
