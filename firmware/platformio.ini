; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filter = esp32_exception_decoder, default
; El SDK del ESP32 también tiene un archivo "config.h": sin este -I, las
; librerías propias (lib/*) resolverían ESE config.h y no el del proyecto.
build_flags = 
	-Iinclude
lib_deps = 
	bblanchon/ArduinoJson@^6.21.2
	adafruit/Adafruit PWM Servo Driver Library@^3.0.1
	adafruit/Adafruit INA219@^1.1.3
	adafruit/Adafruit SSD1306@^2.5.7
