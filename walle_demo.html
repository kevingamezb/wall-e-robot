<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Wall-E · Panel de control (demo)</title>
<style>
  :root {
    --app-bg: #1a1a1a;
    --widget-bg: #000000;
    --gold: #aa8800;
    --gold-dim: #6b5600;
    --log-text: #ffffff;
    --border-soft: #2c2c2c;
    --text-dim: #8a8a8a;
    --phi: 1.618;
    --unit: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--app-bg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8e8e8;
    padding: calc(var(--unit) * var(--phi)) var(--unit);
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.618fr;
    grid-template-rows: auto 1fr;
    gap: var(--unit);
  }
  .widget {
    background: var(--widget-bg);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: var(--unit);
  }
  .row {
    display: grid;
    grid-template-columns: 1.618fr 1fr;
    gap: var(--unit);
  }
  .status-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .status-col .eyes { justify-content: center; }
  .status-col .icons { justify-content: center; }
  .status-col .sun-wrap { justify-content: center; }
  .status-col .power-col { align-items: center; }
  .status-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .status-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
  }
  .status-block + .status-block {
    border-top: 1px solid var(--border-soft);
    padding-top: 8px;
  }
  .status-row > .power-col {
    border-left: 1px solid var(--border-soft);
    padding-left: 14px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px 0;
  }

  /* --- Barra de estado superior --- */
  .eyes { display: flex; gap: 10px; align-items: center; }
  .eye {
    width: 40px; height: 26px;
    border: 2px solid var(--gold);
    border-radius: 50% / 45%;
    background: transparent;
    position: relative;
  }
  .eye::after {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .icons { display: flex; flex-direction: column; gap: 8px; }
  .icon {
    width: 22px; height: 22px;
    border-radius: 4px;
    border: 1.5px solid #444;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #555;
    transition: all 0.2s;
  }
  .icon.conn {
    width: 30px;
    font-size: 10px;
    letter-spacing: -1px;
  }
  .icon.on-warning { border-color: #d88a2a; color: #d88a2a; }
  .icon.on-error { border-color: #c94a4a; color: #c94a4a; }
  .icon.on-gold { border-color: var(--gold); color: var(--gold); }

  .sun-wrap { display: flex; align-items: center; gap: 10px; }
  .sun-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  svg.sun { width: 46px; height: 46px; }
  .sun-label { font-size: 12px; color: var(--text-dim); min-width: 60px; }
  .sun-time { font-size: 11px; color: var(--text-dim); }

  .power-bars { display: flex; flex-direction: column-reverse; gap: 3px; width: 26px; }
  .power-bar { height: 4px; border-radius: 1px; background: #2a2a2a; }
  .power-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .power-label { font-size: 11px; color: var(--text-dim); }

  .radar-sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; text-align: center; }
  .radar-sub .val { color: var(--gold); }

  /* --- Radar --- */
  .radar-svg { width: 100%; height: 140px; display: block; }

  /* --- Logger --- */
  .logger {
    background: var(--widget-bg);
    height: 220px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    padding-right: 4px;
  }
  .logger::-webkit-scrollbar { width: 6px; }
  .logger::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  .log-line { color: var(--log-text); white-space: pre-wrap; }
  .log-line .lvl-info { color: var(--log-text); }
  .log-line .lvl-warn { color: #d88a2a; }
  .log-line .lvl-error { color: #c94a4a; }
  .log-ts { color: #666; }

  /* --- Gamepad --- */
  .gamepad-grid {
    display: grid;
    grid-template-columns: 1.618fr 1fr;
    gap: var(--unit);
    align-items: start;
  }
  .dpad-col { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }
  .dpad-btn {
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 6px;
    color: #666;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    transition: all 0.08s ease;
  }
  .dpad-btn.up { grid-column: 2; grid-row: 1; }
  .dpad-btn.left { grid-column: 1; grid-row: 2; }
  .dpad-btn.center { grid-column: 2; grid-row: 2; background: #000; border-color: #222; cursor: default; }
  .dpad-btn.right { grid-column: 3; grid-row: 2; }
  .dpad-btn.down { grid-column: 2; grid-row: 3; }
  .dpad-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: #1c1502;
  }

  .neck-slider-wrap { width: 100%; max-width: 220px; }
  .neck-slider-wrap .label { text-align: center; margin-bottom: 6px; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: #333;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    border: none;
  }
  input[type="range"].v-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 3px;
    height: 130px;
  }

  .arms-col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .reset-btn {
    width: 100%;
    padding: 8px 0;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 6px;
    color: #999;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.08s ease;
  }
  .reset-btn.active, .reset-btn:active {
    border-color: var(--gold);
    color: var(--gold);
    background: #1c1502;
  }
  .arms-sliders { display: flex; gap: 22px; }
  .arm-slider-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .arm-slider-col .label { margin: 0; }

  .hands-col { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .hand-btn {
    width: 44px; height: 34px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 6px;
    color: #666;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.08s ease;
  }
  .hand-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: #1c1502;
  }

  .bottom-row { display: flex; gap: var(--unit); align-items: flex-start; }
  .bottom-row .gamepad-block { flex: 1.618; }
  .bottom-row .hands-block { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .value-readout { font-size: 11px; color: var(--gold); min-width: 28px; text-align: center; }
</style>
</head>
<body>
<div class="app">

  <div class="widget status-col">
    <div class="status-block">
      <div class="eyes">
        <div class="eye" id="eye-l"></div>
        <div class="eye" id="eye-r"></div>
      </div>
    </div>
    <div class="status-block">
      <div class="status-row">
        <div class="icons">
          <div class="icon on-warning" title="Advertencia">!</div>
          <div class="icon" title="Cargando">⚡</div>
          <div class="icon on-gold" title="Modo manual">M</div>
          <div class="icon" title="Error">X</div>
          <div class="icon on-gold conn" title="Conexión">▂▄█</div>
        </div>
        <div class="power-col">
          <div class="power-bars" id="power-bars"></div>
          <span class="power-label" id="power-label">4.2 W</span>
        </div>
      </div>
    </div>
    <div class="status-block">
      <div class="sun-wrap">
        <svg class="sun" viewBox="0 0 100 100" id="sun-svg"></svg>
        <div class="sun-col">
          <span class="sun-label" id="sun-label">8/12</span>
          <span class="sun-time" id="sun-time">~46 min</span>
        </div>
      </div>
    </div>
  </div>

  <div class="widget">
    <p class="label">Terminal (últimas 30 líneas · rueda para desplazar)</p>
    <div class="logger" id="logger"></div>
  </div>

  <div class="widget">
    <p class="label">Radar</p>
    <svg class="radar-svg" viewBox="0 0 300 150" id="radar-svg"></svg>
    <p class="radar-sub">Objeto detectado a <span class="val" id="radar-dist">37</span> cm</p>
  </div>

  <div class="widget">
    <p class="label">Control manual</p>
    <div class="bottom-row">
      <div class="gamepad-block">
        <div class="gamepad-grid">
          <div class="dpad-col">
            <div class="dpad">
              <div class="dpad-btn up" data-dir="up">▲</div>
              <div class="dpad-btn left" data-dir="left">◀</div>
              <div class="dpad-btn center">●</div>
              <div class="dpad-btn right" data-dir="right">▶</div>
              <div class="dpad-btn down" data-dir="down">▼</div>
            </div>
            <div class="neck-slider-wrap">
              <p class="label" style="margin-bottom:4px">Cuello <span class="value-readout" id="neck-val">0°</span></p>
              <input type="range" min="-70" max="70" value="0" id="neck-slider">
            </div>
          </div>

          <div class="arms-col">
            <button class="reset-btn" id="reset-btn">Reposo</button>
            <div class="arms-sliders">
              <div class="arm-slider-col">
                <span class="label" style="margin:0">Izq</span>
                <input type="range" class="v-slider" min="-50" max="50" value="0" id="arm-l">
                <span class="value-readout" id="arm-l-val">0°</span>
              </div>
              <div class="arm-slider-col">
                <span class="label" style="margin:0">Der</span>
                <input type="range" class="v-slider" min="-50" max="50" value="0" id="arm-r">
                <span class="value-readout" id="arm-r-val">0°</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="hands-block">
        <p class="label" style="margin-bottom:0">Manos</p>
        <div class="hands-col">
          <button class="hand-btn" id="hand-open">Abrir</button>
          <button class="hand-btn" id="hand-close">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const GOLD = "#aa8800";
const GOLD_DIM = "#6b5600";
const GRAY = "#3a3a3a";
const ORANGE = "#d88a2a";
const RED = "#c94a4a";
const LIME = "#8fd82a";

function pressEffect(el) {
  el.addEventListener("mousedown", () => el.classList.add("active"));
  el.addEventListener("mouseup", () => el.classList.remove("active"));
  el.addEventListener("mouseleave", () => el.classList.remove("active"));
  el.addEventListener("touchstart", () => el.classList.add("active"));
  el.addEventListener("touchend", () => el.classList.remove("active"));
}
document.querySelectorAll(".dpad-btn[data-dir]").forEach(pressEffect);
pressEffect(document.getElementById("hand-open"));
pressEffect(document.getElementById("hand-close"));

const neckSlider = document.getElementById("neck-slider");
const neckVal = document.getElementById("neck-val");
neckSlider.addEventListener("input", () => { neckVal.textContent = neckSlider.value + "°"; });

const armL = document.getElementById("arm-l");
const armLVal = document.getElementById("arm-l-val");
armL.addEventListener("input", () => { armLVal.textContent = armL.value + "°"; });

const armR = document.getElementById("arm-r");
const armRVal = document.getElementById("arm-r-val");
armR.addEventListener("input", () => { armRVal.textContent = armR.value + "°"; });

document.getElementById("reset-btn").addEventListener("click", (e) => {
  neckSlider.value = 0; neckVal.textContent = "0°";
  armL.value = 0; armLVal.textContent = "0°";
  armR.value = 0; armRVal.textContent = "0°";
  const btn = e.currentTarget;
  btn.classList.add("active");
  setTimeout(() => btn.classList.remove("active"), 180);
  addLog("info", "SISTEMA", "Todos los servos a posición de reposo");
});

document.getElementById("hand-open").addEventListener("click", () => addLog("info", "MANO", "Abriendo pinza"));
document.getElementById("hand-close").addEventListener("click", () => addLog("info", "MANO", "Cerrando pinza"));
document.querySelectorAll(".dpad-btn[data-dir]").forEach(b => {
  b.addEventListener("click", () => addLog("info", "MOTOR", "Dirección: " + b.dataset.dir));
});

function drawSun(fraction) {
  const svg = document.getElementById("sun-svg");
  svg.innerHTML = "";
  const cx = 50, cy = 50, rInner = 16, rOuterFull = 44, rOuterEmpty = 30;
  const total = 12;
  const litCount = Math.round(fraction * total);
  let color = GRAY;
  let label = "";
  if (fraction === -1) { color = LIME; label = "cargando"; }
  else if (litCount === 0) { color = GRAY; }
  else if (litCount <= 4) { color = RED; }
  else if (litCount <= 7) { color = ORANGE; }
  else { color = GOLD; }

  for (let i = 0; i < total; i++) {
    const angle = (i / total) * 2 * Math.PI - Math.PI / 2;
    const lit = fraction !== -1 && i < litCount;
    const rOuter = lit ? rOuterFull : rOuterEmpty;
    const x1 = cx + Math.cos(angle) * (rInner + 3);
    const y1 = cy + Math.sin(angle) * (rInner + 3);
    const x2 = cx + Math.cos(angle) * rOuter;
    const y2 = cy + Math.sin(angle) * rOuter;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke", lit || fraction === -1 ? color : "#333");
    line.setAttribute("stroke-width", "5");
    line.setAttribute("stroke-linecap", "round");
    svg.appendChild(line);
  }
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", rInner);
  circle.setAttribute("fill", "none");
  circle.setAttribute("stroke", fraction === -1 ? LIME : (litCount > 0 ? color : "#333"));
  circle.setAttribute("stroke-width", "3");
  svg.appendChild(circle);

  document.getElementById("sun-label").textContent = fraction === -1 ? "cargando" : litCount + "/12";
  document.getElementById("sun-label").style.color = fraction === -1 ? LIME : color;
}
drawSun(8/12);

function setTiempoRestante(minutos) {
  document.getElementById("sun-time").textContent = "~" + minutos + " min";
}
setTiempoRestante(46);

function drawPowerBars(watts, maxWatts) {
  const container = document.getElementById("power-bars");
  container.innerHTML = "";
  const totalBars = 10;
  const litCount = Math.round((watts / maxWatts) * totalBars);
  const fraction = watts / maxWatts;
  let color = GOLD;
  if (fraction > 0.7) color = RED;
  else if (fraction > 0.4) color = ORANGE;
  else color = GOLD;

  for (let i = 0; i < totalBars; i++) {
    const bar = document.createElement("div");
    bar.className = "power-bar";
    if (i < litCount) {
      bar.style.background = color;
    }
    container.appendChild(bar);
  }
  document.getElementById("power-label").textContent = watts.toFixed(1) + " W";
  document.getElementById("power-label").style.color = litCount > 0 ? color : "var(--text-dim)";
}
drawPowerBars(4.2, 15);

function drawRadar() {
  const svg = document.getElementById("radar-svg");
  svg.innerHTML = "";
  const cx = 150, cy = 148, R = 130;
  for (let r = 1; r <= 3; r++) {
    const arc = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const rad = (R / 3) * r;
    arc.setAttribute("d", `M ${cx - rad} ${cy} A ${rad} ${rad} 0 0 1 ${cx + rad} ${cy}`);
    arc.setAttribute("fill", "none");
    arc.setAttribute("stroke", "#2a2a2a");
    arc.setAttribute("stroke-width", "1");
    svg.appendChild(arc);
  }
  for (let a = 0; a <= 180; a += 30) {
    const rad = (a * Math.PI) / 180;
    const x = cx - Math.cos(rad) * R;
    const y = cy - Math.sin(rad) * R;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", cx); line.setAttribute("y1", cy);
    line.setAttribute("x2", x); line.setAttribute("y2", y);
    line.setAttribute("stroke", "#2a2a2a");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);
  }
  const sweepAngle = 65;
  const rad1 = (sweepAngle * Math.PI) / 180;
  const rad2 = ((sweepAngle - 22) * Math.PI) / 180;
  const x1 = cx - Math.cos(rad1) * R, y1 = cy - Math.sin(rad1) * R;
  const x2 = cx - Math.cos(rad2) * R, y2 = cy - Math.sin(rad2) * R;
  const sweep = document.createElementNS("http://www.w3.org/2000/svg", "path");
  sweep.setAttribute("d", `M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2} Z`);
  sweep.setAttribute("fill", GOLD_DIM);
  sweep.setAttribute("opacity", "0.5");
  svg.appendChild(sweep);
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  const dotRad = ((sweepAngle - 10) * Math.PI) / 180;
  dot.setAttribute("cx", cx - Math.cos(dotRad) * R * 0.6);
  dot.setAttribute("cy", cy - Math.sin(dotRad) * R * 0.6);
  dot.setAttribute("r", "5");
  dot.setAttribute("fill", ORANGE);
  svg.appendChild(dot);
}
drawRadar();

const MAX_LOG = 30;
const logEl = document.getElementById("logger");
let logCount = 0;
function addLog(level, origin, msg) {
  logCount++;
  const line = document.createElement("div");
  line.className = "log-line";
  const cls = level === "warn" ? "lvl-warn" : level === "error" ? "lvl-error" : "lvl-info";
  const now = new Date();
  const ts = now.toTimeString().slice(0,8);
  line.innerHTML = `<span class="log-ts">[${ts}]</span> <span class="${cls}">[${origin}]</span> ${msg}`;
  logEl.appendChild(line);
  while (logEl.children.length > MAX_LOG) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

const sampleLogs = [
  ["info", "SISTEMA", "Iniciando subsistemas"],
  ["info", "CONEXIÓN", "Enlazado con terminal remota"],
  ["warn", "SENSOR", "Obstáculo a 8cm frente"],
  ["info", "MOTOR", "Avanzando"],
  ["error", "SERVO-HOMBRO", "Ángulo fuera de rango solicitado"],
  ["info", "BATERÍA", "Nivel 66%"],
];
sampleLogs.forEach((l, i) => setTimeout(() => addLog(...l), i * 260));
</script>
</body>
</html>
